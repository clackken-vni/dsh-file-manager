name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      # This is a prebuilt package with only peer/dev dependencies, so publishing
      # needs no dependency install (and several @deepseek-ai/* peers are private,
      # so an install would fail anyway). We just pack and publish the tarball.

      - name: Smoke check
        run: node -e "const p=require('./package.json'); if(!p.name||!p.version) process.exit(1); console.log('name',p.name,'version',p.version)"

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}